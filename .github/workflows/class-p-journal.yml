name: Local Class P journal targeted checks
on:
  pull_request:
    paths:
      - src/ipc/**
      - tests/class_p_journal.test.ts
      - .github/workflows/class-p-journal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build:tsc
      - name: Synthetic journal and adjacent Class A/P contracts only
        run: node --test dist/tests/class_p_journal.test.js dist/tests/g3_ipc_framing.test.js dist/tests/g3_startup_validation.test.js dist/tests/g3_caller_authority.test.js dist/tests/g3_write_gate.test.js dist/tests/stage4_broker_import_ipc.test.js
